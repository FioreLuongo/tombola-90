<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='300' height='300'>
  <defs>
    <!-- Soft shadow filter -->
    <filter id='shadowRed' x='-10%' y='-10%' width='130%' height='130%'>
      <feDropShadow dx='0' dy='5' stdDeviation='5' flood-color='#000000' flood-opacity='0.35'/>
    </filter>
    
    <!-- Outer single red ring gradient -->
    <radialGradient id='singleRedRing' cx='35%' cy='30%' r='70%'>
      <stop offset='0%' stop-color='#ef4457'/>
      <stop offset='35%' stop-color='#dc2638'/>
      <stop offset='75%' stop-color='#b91c2c'/>
      <stop offset='100%' stop-color='#991b1b'/>
    </radialGradient>

    <!-- Wood cork texture gradient -->
    <radialGradient id='woodDiskRed' cx='40%' cy='36%' r='65%'>
      <stop offset='0%' stop-color='#f5e9d4'/>
      <stop offset='45%' stop-color='#e8d7bb'/>
      <stop offset='80%' stop-color='#dec5a4'/>
      <stop offset='100%' stop-color='#d2b48e'/>
    </radialGradient>

    <!-- Subtle wood noise filter -->
    <filter id='woodGrainRed' x='0' y='0' width='100%' height='100%'>
      <feTurbulence type='fractalNoise' baseFrequency='0.38 0.12' numOctaves='3' result='noise'/>
      <feColorMatrix type='matrix' values='
        0 0 0 0 0.85
        0 0 0 0 0.76
        0 0 0 0 0.62
        0 0 0 0.12 0' result='colorNoise'/>
      <feBlend in='SourceGraphic' in2='colorNoise' mode='multiply'/>
    </filter>
  </defs>

  <!-- Single Outer Red Rim (One clean red circular band, no double ring) -->
  <circle cx='150' cy='150' r='142' fill='url(#singleRedRing)' filter='url(#shadowRed)'/>
  
  <!-- Subtle top specular curve on the red rim -->
  <circle cx='150' cy='150' r='140' fill='none' stroke='rgba(255,255,255,0.28)' stroke-width='2' opacity='0.7'/>

  <!-- Inner Wood Face (Clean junction, only one red ring) -->
  <circle cx='150' cy='150' r='114' fill='url(#woodDiskRed)' filter='url(#woodGrainRed)'/>
</svg>