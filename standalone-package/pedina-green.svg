<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='300' height='300'>
  <defs>
    <!-- Soft shadow filter -->
    <filter id='shadowGreen' x='-10%' y='-10%' width='130%' height='130%'>
      <feDropShadow dx='0' dy='5' stdDeviation='5' flood-color='#000000' flood-opacity='0.35'/>
    </filter>
    
    <!-- Outer single green ring gradient -->
    <radialGradient id='singleGreenRing' cx='35%' cy='30%' r='70%'>
      <stop offset='0%' stop-color='#34d399'/>
      <stop offset='35%' stop-color='#10b981'/>
      <stop offset='75%' stop-color='#059669'/>
      <stop offset='100%' stop-color='#047857'/>
    </radialGradient>

    <!-- Wood cork texture gradient -->
    <radialGradient id='woodDiskGreen' cx='40%' cy='36%' r='65%'>
      <stop offset='0%' stop-color='#f5e9d4'/>
      <stop offset='45%' stop-color='#e8d7bb'/>
      <stop offset='80%' stop-color='#dec5a4'/>
      <stop offset='100%' stop-color='#d2b48e'/>
    </radialGradient>

    <!-- Subtle wood noise filter -->
    <filter id='woodGrainGreen' x='0' y='0' width='100%' height='100%'>
      <feTurbulence type='fractalNoise' baseFrequency='0.38 0.12' numOctaves='3' result='noise'/>
      <feColorMatrix type='matrix' values='
        0 0 0 0 0.85
        0 0 0 0 0.76
        0 0 0 0 0.62
        0 0 0 0.12 0' result='colorNoise'/>
      <feBlend in='SourceGraphic' in2='colorNoise' mode='multiply'/>
    </filter>
  </defs>

  <!-- Single Outer Green Rim (One clean green circular band, no double ring) -->
  <circle cx='150' cy='150' r='142' fill='url(#singleGreenRing)' filter='url(#shadowGreen)'/>
  
  <!-- Subtle top specular curve on the green rim -->
  <circle cx='150' cy='150' r='140' fill='none' stroke='rgba(255,255,255,0.3)' stroke-width='2' opacity='0.7'/>

  <!-- Inner Wood Face (Clean junction, only one green ring) -->
  <circle cx='150' cy='150' r='114' fill='url(#woodDiskGreen)' filter='url(#woodGrainGreen)'/>
</svg>
